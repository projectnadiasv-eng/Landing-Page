<!-- ============ SIGNAL PRO PRELOADER (ns: sploader) ============ -->
<div id="sploader" class="sploader" aria-hidden="false">
  <div class="splo-stage">
    <div class="splo-mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="22.5" fill="#2B2018"/>
        <path d="M44.8 22.9H55.2V44.8H76.7V55.2A21.7 21.7 0 0 0 55.2 76.9H44.8V55.2H23.2V44.8A21.7 21.7 0 0 0 44.8 22.9Z" fill="#FAF0E9"/>
      </svg>
    </div>
    <div class="splo-text-wrap">
      <span class="splo-text">SIGNAL<span class="splo-pro">PRO</span></span>
    </div>
    <div class="splo-tagline">
      <span class="splo-tag-line"></span>
      <span class="splo-tag-word">All signal. Zero noise.</span>
      <span class="splo-tag-line"></span>
    </div>
  </div>
</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap');

body.splo-locked{ overflow:hidden !important; touch-action:none !important; }
html.splo-locked{ overflow:hidden !important; }

.sploader{
  position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow:hidden; z-index:2147483647; background:#FAF0E9;
  display:flex; align-items:center; justify-content:center; pointer-events:auto;
  transition:opacity 0.7s cubic-bezier(0.65,0,0.35,1), visibility 0s linear 0.7s;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.sploader.splo-hide{ opacity:0; visibility:hidden; pointer-events:none; }
.sploader::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(70% 60% at 50% 42%, rgba(253,239,220,0.85) 0%, rgba(253,239,220,0) 62%),
    radial-gradient(90% 70% at 12% 92%, rgba(216,184,156,0.35) 0%, rgba(216,184,156,0) 60%);
  pointer-events:none;
}

.sploader .splo-stage{
  position:relative; display:flex; flex-direction:column; align-items:center;
  gap:clamp(18px,2.6vw,32px); padding:0 20px; text-align:center;
}

.sploader .splo-mark{
  width:clamp(48px,7vmin,74px); opacity:0; transform:translateY(10px) scale(0.94);
  animation:sploMark 0.8s cubic-bezier(0.16,1,0.3,1) 120ms forwards;
}
.sploader .splo-mark svg{
  width:100%; height:auto; display:block; border-radius:22%;
  filter:drop-shadow(0 10px 24px rgba(43,32,24,0.28));
}
@keyframes sploMark{ to{ opacity:1; transform:none; } }

.sploader .splo-text-wrap{ position:relative; display:inline-block; }
.sploader .splo-text{
  display:inline-block;
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Figtree','Segoe UI',Arial,sans-serif;
  font-weight:400; font-style:normal; letter-spacing:-0.005em;
  font-size:clamp(38px,12.5vw,150px); line-height:1; white-space:nowrap;
  max-width:100%; color:#2B2018; user-select:none; cursor:default;
  opacity:0; transform:translate(0,0);
  text-shadow:0em 0em transparent,0em 0em transparent,0em 0em transparent,0em 0em transparent;
  animation:sploLayerize cubic-bezier(0.4,0,0.2,1) 1200ms 320ms forwards;
}
.sploader .splo-pro{
  color:rgba(43,32,24,0.55); font-style:italic; font-weight:400;
  letter-spacing:0.04em; margin-left:0.14em;
}

@keyframes sploLayerize{
  0%{
    opacity:0; transform:translate(0,0);
    text-shadow:0em 0em transparent,0em 0em transparent,0em 0em transparent,0em 0em transparent;
  }
  100%{
    opacity:1; transform:translate(-0.06666em, -0.06666em);
    text-shadow:
      0.03333em 0.03333em rgba(216,184,156,0.95),
      0.06666em 0.06666em rgba(224,213,183,0.80),
      0.09999em 0.09999em rgba(239,215,200,0.65),
      0.13332em 0.13332em rgba(253,239,220,0.50);
  }
}

.sploader .splo-tagline{
  display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(12px);
  animation:sploFadeUp 0.8s cubic-bezier(0.16,1,0.3,1) 1220ms forwards;
}
.sploader .splo-tag-line{
  display:block; width:clamp(28px,5vw,56px); height:1px; background:rgba(216,184,156,0.9);
}
.sploader .splo-tag-word{
  font-family:'JetBrains Mono','Inter',monospace; font-size:clamp(10px,1vw,13px);
  font-weight:500; letter-spacing:0.22em; text-transform:uppercase;
  color:#2B2018; opacity:0.75; white-space:nowrap;
}
@keyframes sploFadeUp{ to{ opacity:1; transform:translateY(0); } }

@media (max-width:480px){
  .sploader .splo-stage{ gap:16px; padding:0 16px; }
  .sploader .splo-text{ font-size:clamp(34px,12vw,58px); }
  .sploader .splo-mark{ width:clamp(42px,13vw,58px); }
  .sploader .splo-tag-word{ letter-spacing:0.14em; font-size:9.5px; }
  .sploader .splo-tag-line{ width:20px; }
}
@media (max-width:360px){
  .sploader .splo-text{ font-size:32px; }
  .sploader .splo-tag-line{ display:none; }
}

@media (prefers-reduced-motion:reduce){
  .sploader .splo-mark, .sploader .splo-text, .sploader .splo-tagline{
    opacity:1; transform:none; animation:none;
  }
  .sploader .splo-text{ text-shadow:none; }
}

.sploader .splo-text{ font-weight:700 !important; letter-spacing:-0.02em !important; }
</style>

<script>
(function(){
  var preloader = document.getElementById('sploader');
  if (!preloader) return;
  try {
    if (preloader.parentNode !== document.body){ document.body.appendChild(preloader); }
  } catch(e){}
  try {
    document.body.classList.add('splo-locked');
    document.documentElement.classList.add('splo-locked');
  } catch(e){}
  var HOLD_MS = 2400;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ HOLD_MS = 800; }
  function hide(){
    preloader.classList.add('splo-hide');
    preloader.setAttribute('aria-hidden','true');
    setTimeout(function(){
      try {
        document.body.classList.remove('splo-locked');
        document.documentElement.classList.remove('splo-locked');
      } catch(e){}
      if (preloader && preloader.parentNode){ preloader.parentNode.removeChild(preloader); }
    }, 800);
  }
  function start(){ setTimeout(hide, HOLD_MS); }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', start);
  } else { start(); }
  setTimeout(function(){
    if (preloader && !preloader.classList.contains('splo-hide')){ hide(); }
  }, 6000);
})();
</script>
