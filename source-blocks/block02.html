<!-- ================= SIGNAL PRO SCROLL-EXPAND HERO (ns: sehx2) ================= -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<div id="sehx2-root">
  <style>
    #sehx2-root *{ box-sizing:border-box; margin:0; padding:0; }
    #sehx2-root{
      --sp-blue:#1A73F0; --sp-blue-d:#0F4FB5; --sp-ice:#8FD9FF;
      --sp-ink:#2B2018; --sp-page:#FAF0E9; --sp-cream:#FDEFDC;
      --sp-blush:#EFD7C8; --sp-sand:#E0D5B7; --sp-tan:#D8B89C;
      --sehx2-glow:0.18;
      --sx-sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Figtree','Segoe UI',Arial,sans-serif;
      --sx-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Figtree','Segoe UI',Arial,sans-serif;
      --sx-serif:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','Figtree','Segoe UI',Arial,sans-serif;
      --sx-mono:'JetBrains Mono',ui-monospace,monospace;
      position:relative; width:100%; display:block; isolation:isolate;
      font-family:var(--sx-sans); color:#fff;
      -webkit-font-smoothing:antialiased;
    }

    #sehx2-root .sehx2-track{ position:relative; width:100%; height:100vh; height:100dvh; }
    #sehx2-root .sehx2-sticky{
      position:absolute; top:0; left:0; height:100vh; height:100dvh; width:100%;
      overflow:hidden; background:#05070C;
    }
    #sehx2-root .sehx2-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; }
    #sehx2-root .sehx2-bg video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

    #sehx2-root .sehx2-media{
      position:absolute; top:50%; left:50%; z-index:1;
      transform:translate(-50%,-50%);
      width:360px; height:420px; max-width:100vw; max-height:100vh;
      border-radius:22px; overflow:hidden;
      box-shadow:0 30px 80px rgba(0,0,0,0.55);
    }
    #sehx2-root .sehx2-media video{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:cover; display:block;
    }
    #sehx2-root .sehx2-media-veil{ position:absolute; inset:0; z-index:1; pointer-events:none; background:none; opacity:0; }
    #sehx2-root .sehx2-scrim{ position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0; background:none; }
    #sehx2-root .sehx2-title{
      position:absolute; top:50%; left:50%; z-index:3;
      transform:translate(-50%,-50%);
      display:flex; flex-direction:column; align-items:center; gap:4px;
      text-align:center; width:100%; max-width:min(386px,84vw); pointer-events:none;
    }
    #sehx2-root .sehx2-word{ display:block; line-height:1.04; will-change:transform; }
    #sehx2-root .sehx2-word-l,
    #sehx2-root .sehx2-word-r em{ color:#fff; text-shadow:0 3px 22px rgba(0,0,0,0.55); }
    #sehx2-root .sehx2-word-l{
      font-family:var(--sx-display); font-weight:800;
      font-size:clamp(16px,1.85vw,24px); letter-spacing:-0.03em;
    }
    #sehx2-root .sehx2-word-r em{
      font-family:var(--sx-serif); font-style:italic; font-weight:500;
      font-size:clamp(21px,2.9vw,38px); letter-spacing:-0.005em;
    }
    #sehx2-root .sx-grad{
      background:
        linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 58%),
        linear-gradient(110deg,#ffffff 0%,#ffffff 100%);
      background-size:260% 100%, 100% 100%;
      background-position:180% 0, 0 0;
      background-repeat:no-repeat, no-repeat;
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:transparent;
      filter:drop-shadow(0 0 12px rgba(143,217,255,var(--sehx2-glow,0.18)));
      animation:sehx2Bolt 2.8s cubic-bezier(.45,.05,.55,.95) infinite alternate;
      will-change:background-position, filter;
    }
    @keyframes sehx2Bolt{
      0%{ background-position:180% 0, 0 0; }
      100%{ background-position:-90% 0, 0 0; }
    }
    @supports not ((-webkit-background-clip:text) or (background-clip:text)){
      #sehx2-root .sx-grad{ color:#ffffff; -webkit-text-fill-color:#ffffff; animation:none; filter:none; }
    }
    #sehx2-root .sehx2-hint{
      position:absolute; left:50%; bottom:clamp(22px,4vh,40px); z-index:4;
      transform:translateX(-50%);
      font-family:var(--sx-mono); font-weight:500; letter-spacing:0.18em;
      text-transform:uppercase; font-size:11px; color:rgba(255,255,255,0.7);
      display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;
    }
    #sehx2-root .sehx2-hint svg{ width:16px; height:16px; stroke:rgba(255,255,255,0.7); animation:sehx2Bob 1.8s ease-in-out infinite; }
    @keyframes sehx2Bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }
    #sehx2-root .sehx2-reveal{
      position:absolute; top:50%; left:50%; z-index:4;
      transform:translate(-50%,calc(-50% + 16px));
      width:min(1040px,92vw); text-align:center; opacity:0; pointer-events:none;
    }
    #sehx2-root .sehx2-rev-h{
      font-family:var(--sx-display); font-weight:800; color:#fff;
      font-size:clamp(40px,6.4vw,86px); line-height:1.05; letter-spacing:-0.02em;
      text-shadow:0 2px 26px rgba(0,0,0,0.55);
    }
    #sehx2-root .sehx2-rev-h em{ font-family:var(--sx-serif); font-style:italic; font-weight:500; font-size:0.97em; letter-spacing:-0.006em; }
    #sehx2-root .sehx2-rev-mobile{ display:none; }
    #sehx2-root .sehx2-nav{
      position:absolute; top:0; left:0; right:0; z-index:6;
      display:flex; align-items:center; justify-content:space-between;
      padding:clamp(16px,2.4vw,26px) clamp(18px,4vw,52px);
      gap:18px;
    }
    #sehx2-root .sehx2-nav::before{
      content:''; position:absolute; left:0; right:0; top:0; z-index:-1;
      height:clamp(120px,17vh,190px); pointer-events:none;
      background:linear-gradient(180deg,
                 rgba(3,6,12,0.72) 0%,
                 rgba(3,6,12,0.46) 42%,
                 rgba(3,6,12,0.18) 72%,
                 rgba(3,6,12,0) 100%);
    }
    #sehx2-root .sehx2-nav-logo{ display:inline-flex; align-items:center; gap:12px; flex-shrink:0; text-decoration:none; }
    #sehx2-root .sehx2-nav-logo svg{ width:clamp(38px,4.2vw,52px); height:auto; border-radius:11px; display:block;
      filter:drop-shadow(0 2px 10px rgba(0,0,0,0.45)); }
    #sehx2-root .sehx2-nav-logo b{
      font-family:var(--sx-display); font-weight:800; text-transform:uppercase;
      font-size:clamp(18px,1.8vw,25px); letter-spacing:0.01em; color:#ffffff;
      text-shadow:0 1px 10px rgba(0,0,0,0.45);
    }
    #sehx2-root .sehx2-nav-logo i{
      font-style:normal; font-family:var(--sx-display); font-weight:400; text-transform:uppercase;
      font-size:clamp(18px,1.8vw,25px); letter-spacing:0.07em; color:rgba(255,255,255,0.62);
      margin-left:7px; text-shadow:0 1px 10px rgba(0,0,0,0.45);
    }
    #sehx2-root .sehx2-nav-links{
      display:flex; align-items:center; gap:clamp(20px,2.6vw,40px);
      position:absolute; left:50%; transform:translateX(-50%);
    }
    #sehx2-root .sehx2-nav-links a{
      font-family:var(--sx-serif); font-style:normal; font-weight:500;
      font-size:clamp(17px,1.5vw,21px); color:#ffffff; letter-spacing:0.005em;
      text-decoration:none; text-shadow:0 1px 10px rgba(0,0,0,0.45);
      opacity:0.92; transition:opacity .2s ease, color .2s ease;
      white-space:nowrap; cursor:pointer;
    }
    #sehx2-root .sehx2-nav-links a:hover{ opacity:1; color:var(--sp-ice); }
    #sehx2-root .sehx2-btn{
      position:relative; display:inline-flex; border-radius:99px;
      text-decoration:none; cursor:pointer; isolation:isolate; -webkit-tap-highlight-color:transparent;
    }
    #sehx2-root .sehx2-btn .glow{
      position:absolute; inset:-8px; border-radius:inherit; z-index:0;
      background:radial-gradient(60% 130% at 50% 50%, rgba(216,184,156,0.85), rgba(239,215,200,0.38) 55%, transparent 80%);
      filter:blur(14px); opacity:0.9; animation:sehx2Pulse 3.4s ease-in-out infinite;
    }
    @keyframes sehx2Pulse{ 0%,100%{ opacity:0.6; transform:scale(0.97); } 50%{ opacity:1; transform:scale(1.05); } }
    @keyframes sehx2BtnFlow{ 0%{ background-position:0% 0; } 100%{ background-position:-200% 0; } }
    #sehx2-root .sehx2-btn .body{
      position:relative; z-index:1; display:inline-flex; align-items:center; gap:9px;
      padding:11px 24px; border-radius:inherit; overflow:hidden;
      background:linear-gradient(100deg, #FDEFDC 0%, #FAF0E9 20%, #EFD7C8 42%, #E0D5B7 58%, #EFD7C8 78%, #FDEFDC 100%);
      background-size:200% 100%; background-repeat:repeat;
      animation:sehx2BtnFlow 5s linear infinite;
      border:1.5px solid rgba(255,255,255,0.72);
      box-shadow:0 10px 30px rgba(0,0,0,0.42), 0 4px 18px rgba(216,184,156,0.40), inset 0 1px 0 rgba(255,255,255,0.75), inset 0 -10px 22px rgba(43,32,24,0.10);
      color:var(--sp-ink); font-family:var(--sx-sans); font-weight:700; letter-spacing:0.01em;
      font-size:clamp(13px,1vw,15px); white-space:nowrap; text-shadow:none;
    }
    #sehx2-root .sehx2-btn .shine{
      position:absolute; left:0; right:0; top:0; height:52%; z-index:1; border-radius:inherit; pointer-events:none;
      background:linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0) 100%);
    }
    #sehx2-root .sehx2-btn .body svg{ width:15px; height:15px; flex-shrink:0; stroke:var(--sp-ink); }
    #sehx2-root .sehx2-btn:hover .glow{ opacity:1; filter:blur(18px); }
    #sehx2-root .sehx2-btn:active{ transform:translateY(1px); }
    #sehx2-root .sehx2-btn--lg .body{ padding:15px 32px; font-size:clamp(14px,1.1vw,16px); }
    #sehx2-root .sehx2-btn--lg .body svg{ width:17px; height:17px; }

    #sehx2-root .sehx2-burger{
      display:none; flex-direction:column; justify-content:center; gap:5px;
      width:44px; height:40px; padding:8px; border:0; background:transparent;
      cursor:pointer; z-index:8; -webkit-tap-highlight-color:transparent;
    }
    #sehx2-root .sehx2-burger span{
      display:block; width:26px; height:2px; border-radius:2px; background:#fff;
      box-shadow:0 1px 6px rgba(0,0,0,0.5);
      transition:transform .3s ease, opacity .2s ease;
    }
    #sehx2-root.sehx2-open .sehx2-burger span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
    #sehx2-root.sehx2-open .sehx2-burger span:nth-child(2){ opacity:0; }
    #sehx2-root.sehx2-open .sehx2-burger span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

    #sehx2-root .sehx2-mobile-menu{
      position:absolute; top:0; left:0; right:0; z-index:5;
      display:flex; flex-direction:column; align-items:center; gap:24px;
      padding:104px 24px 44px;
      background:rgba(5,7,12,0.94);
      -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      transform:translateY(-105%); opacity:0; pointer-events:none;
      transition:transform .35s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    }
    #sehx2-root.sehx2-open .sehx2-mobile-menu{ transform:translateY(0); opacity:1; pointer-events:auto; }
    #sehx2-root .sehx2-mobile-menu a{
      font-family:var(--sx-serif); font-style:normal; font-weight:500;
      font-size:28px; line-height:1; color:#fff; text-decoration:none;
    }
    @media (min-width:761px){ #sehx2-root .sehx2-mobile-menu{ display:none; } }

    @media (max-width:760px){
      #sehx2-root .sehx2-nav-links{ display:none; }
      #sehx2-root .sehx2-btn{ display:none; }
      #sehx2-root .sehx2-burger{ display:inline-flex; }
      #sehx2-root .sehx2-nav-logo svg{ width:40px; }
      #sehx2-root .sehx2-nav-logo b,
      #sehx2-root .sehx2-nav-logo i{ font-size:19px; }
      #sehx2-root .sehx2-word-l{ font-size:clamp(17px,5.2vw,22px); white-space:nowrap; }
      #sehx2-root .sehx2-word-r{ font-size:clamp(17px,5.2vw,22px) !important; }
      #sehx2-root .sehx2-word-r em{ font-size:inherit; white-space:nowrap; }
      #sehx2-root .sehx2-word-r{ white-space:nowrap; }
      #sehx2-root .sehx2-title{ max-width:min(360px,92vw); gap:2px; }
      #sehx2-root .sehx2-rev-desktop{ display:none; }
      #sehx2-root .sehx2-rev-mobile{ display:block; }
      #sehx2-root .sehx2-rev-h{ font-size:clamp(36px,10vw,60px); line-height:1.05; }
      #sehx2-root .sehx2-rev-mobile .sehx2-stz{ display:block; line-height:1.06; }
      #sehx2-root .sehx2-rev-mobile .sehx2-stz + .sehx2-stz{ margin-top:2px; }
    }
    @media (prefers-reduced-motion:reduce){
      #sehx2-root .sehx2-btn .glow,
      #sehx2-root .sehx2-btn .body,
      #sehx2-root .sx-grad,
      #sehx2-root .sehx2-hint svg{ animation:none !important; }
    }

    #sehx2-root .sehx2-word-l,
    #sehx2-root .sehx2-word-r em,
    #sehx2-root .sehx2-rev-h,
    #sehx2-root .sehx2-rev-h em,
    #sehx2-root .sehx2-nav-logo b,
    #sehx2-root .sehx2-nav-logo i,
    #sehx2-root .sehx2-nav-links a,
    #sehx2-root .sehx2-mobile-menu a,
    #sehx2-root .sehx2-btn .body{
      font-family:var(--sx-serif) !important; font-weight:400 !important;
    }
    #sehx2-root .sehx2-word-l{ font-style:normal !important; letter-spacing:-0.008em !important; }
    #sehx2-root .sehx2-word-r{ font-size:clamp(16px,1.85vw,24px) !important; }
    #sehx2-root .sehx2-word-r em{ font-style:italic !important; font-size:inherit !important; letter-spacing:0 !important; }
    #sehx2-root .sehx2-rev-h{ letter-spacing:-0.008em !important; }
    #sehx2-root .sehx2-rev-h em{ font-size:1em !important; letter-spacing:0 !important; }
    #sehx2-root .sehx2-nav-logo b{ letter-spacing:0.01em !important; }
    #sehx2-root .sehx2-mobile-menu a{ font-style:normal !important; font-weight:500 !important; }
    #sehx2-root .sehx2-nav-logo i{ letter-spacing:0.06em !important; }
    #sehx2-root .sehx2-nav-links a{ font-weight:500 !important; font-style:normal !important; }
    #sehx2-root .sehx2-btn .body{ font-size:clamp(15px,1.15vw,17px) !important; letter-spacing:0 !important; }

#sehx2-root .sehx2-word-l,
#sehx2-root .sehx2-word-r,
#sehx2-root .sehx2-word-r em,
#sehx2-root .sehx2-rev-h,
#sehx2-root .sehx2-rev-h em,
#sehx2-root .sehx2-nav-logo b{
  font-weight:700 !important;
  letter-spacing:-0.02em !important;
}
</style>

  <script>
  (function(){
    try{
      var el=document.getElementById('sehx2-root');
      if(el){
        var p=el.parentElement, depth=0;
        while(p && depth<40){
          var cs=window.getComputedStyle(p), bg=cs.backgroundColor;
          if(bg && bg!=='rgba(0, 0, 0, 0)' && bg!=='transparent'){
            p.style.setProperty('background','transparent','important');
            p.style.setProperty('background-color','transparent','important');
          }
          if(p===document.body) break;
          p=p.parentElement; depth++;
        }
        document.documentElement.style.setProperty('background','#ffffff','important');
        if(document.body) document.body.style.setProperty('background','#ffffff','important');
      }
    }catch(e){}

    var root=document.getElementById('sehx2-root');
    if(!root) return;
    var stage=root.querySelector('.sehx2-sticky');
    var media=root.querySelector('.sehx2-media');
    var veil=root.querySelector('.sehx2-media-veil');
    var scrim=root.querySelector('.sehx2-scrim');
    var titleWrap=root.querySelector('.sehx2-title');
    var wl=root.querySelector('.sehx2-word-l');
    var wr=root.querySelector('.sehx2-word-r');
    var hint=root.querySelector('.sehx2-hint');
    var reveal=root.querySelector('.sehx2-reveal');

    var vids=root.querySelectorAll('video');
    function forcePlay(){
      for(var i=0;i<vids.length;i++){
        var v=vids[i];
        try{
          v.muted=true; v.defaultMuted=true;
          v.playsInline=true;
          v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
          v.removeAttribute('controls');
          var pr=v.play(); if(pr && pr.catch){ pr.catch(function(){}); }
        }catch(e){}
      }
    }
    forcePlay();
    ['touchstart','pointerdown','click','keydown'].forEach(function(ev){
      window.addEventListener(ev, forcePlay, {once:true, passive:true});
    });


    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
    function lerp(a,b,t){ return a+(b-a)*t; }

    function apply(e){
      var vw=stage.clientWidth||window.innerWidth;
      var vh=stage.clientHeight||window.innerHeight;
      var isMobile=vw<768;
      var startW=isMobile?Math.min(306,vw*0.78):Math.min(410,vw*0.41);
      var startH=isMobile?Math.min(336,vh*0.45):Math.min(402,vh*0.50);
      media.style.width=lerp(startW,vw,e)+'px';
      media.style.height=lerp(startH,vh,e)+'px';
      media.style.borderRadius=lerp(22,0,e)+'px';
      media.style.boxShadow=e>0.985?'none':'0 30px 80px rgba(0,0,0,0.55)';
      if(veil) veil.style.opacity='0';
      if(scrim) scrim.style.opacity='0';
      root.querySelector('.sehx2-bg').style.opacity=clamp(1-e*1.1,0,1).toFixed(3);

      var tx=e*(isMobile?38:26);
      wl.style.transform='translateX(-'+tx+'vw)';
      wr.style.transform='translateX('+tx+'vw)';
      titleWrap.style.opacity=clamp(1-e*1.5,0,1).toFixed(3);

      if(hint) hint.style.opacity=clamp(1-e*3.5,0,1).toFixed(3);

      var rp=clamp((e-0.86)/0.14,0,1);
      root.style.setProperty('--sehx2-glow', (0.15+rp*0.6).toFixed(3));
      reveal.style.opacity=rp.toFixed(3);
      reveal.style.transform='translate(-50%,calc(-50% + '+lerp(16,0,rp).toFixed(1)+'px))';
      reveal.style.pointerEvents=rp>0.5?'auto':'none';
    }

    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var progress=0, fullyExpanded=false, touchStartY=0;
    function render(){ apply(progress); }

    if(reduce){
      progress=1; fullyExpanded=true; apply(1);
    }else{
      apply(0);

      function onWheel(e){
        if(fullyExpanded && e.deltaY<0 && window.scrollY<=5){
          fullyExpanded=false; e.preventDefault();
        }else if(!fullyExpanded){
          e.preventDefault();
          progress=clamp(progress + e.deltaY*0.0009, 0, 1);
          if(progress>=1){ fullyExpanded=true; }
          render();
        }
      }
      function onTouchStart(e){ touchStartY=e.touches[0].clientY; }
      function onTouchMove(e){
        if(!touchStartY) return;
        var ty=e.touches[0].clientY, dy=touchStartY-ty;
        if(fullyExpanded && dy<-20 && window.scrollY<=5){
          fullyExpanded=false; e.preventDefault();
        }else if(!fullyExpanded){
          e.preventDefault();
          var f=0.0045;
          progress=clamp(progress + dy*f, 0, 1);
          if(progress>=1){ fullyExpanded=true; }
          touchStartY=ty;
          render();
        }
      }
      function onTouchEnd(){ touchStartY=0; }
      function lockTop(){ if(!fullyExpanded){ window.scrollTo(0,0); } }

      window.addEventListener('wheel', onWheel, {passive:false});
      window.addEventListener('touchstart', onTouchStart, {passive:false});
      window.addEventListener('touchmove', onTouchMove, {passive:false});
      window.addEventListener('touchend', onTouchEnd, {passive:true});
      window.addEventListener('scroll', lockTop, {passive:true});
      window.addEventListener('resize', render, {passive:true});
    }

    var FALLBACKS = {
      'spfeatures-root': ['.teaser', '.shell__title', '#colX', '#xfeed'],
      'splive-root':     ['.c-grid'],
      'sppricing-root':  ['.p-grid']
    };

    function findByHeading(words){
      var hs = document.querySelectorAll('h1,h2');
      for(var i=0;i<hs.length;i++){
        var t = (hs[i].textContent||'').toLowerCase();
        var ok = true;
        for(var w=0;w<words.length;w++){ if(t.indexOf(words[w]) === -1){ ok = false; break; } }
        if(ok) return hs[i];
      }
      return null;
    }

    function findById(id){
      var d=document.getElementById(id); if(d) return d;
      var fb = FALLBACKS[id] || [];
      for(var f=0; f<fb.length; f++){
        try{ var el = document.querySelector(fb[f]); if(el) return el; }catch(_){}
      }
      if(id === 'spfeatures-root'){
        var h = findByHeading(['social','intelligence']);
        if(h) return h;
      }
      try{ var t=(window.top||window).document; var e=t.getElementById(id); if(e) return e; }catch(_){}
      try{
        var ifr=document.querySelectorAll('iframe');
        for(var i=0;i<ifr.length;i++){
          try{ var cd=ifr[i].contentDocument; if(cd){ var el=cd.getElementById(id); if(el) return el; } }catch(_){}
        }
      }catch(_){}
      return null;
    }
    function go(id,e){
      var el=findById(id);
      if(el){
        if(e) e.preventDefault();
        fullyExpanded=true;
        if(progress<1){ progress=1; apply(1); }
        el.scrollIntoView({behavior:'smooth',block:'start'});
      }
    }

    var burger=root.querySelector('.sehx2-burger');
    function closeMenu(){ root.classList.remove('sehx2-open'); if(burger) burger.setAttribute('aria-expanded','false'); }
    if(burger){
      burger.addEventListener('click',function(){
        var open=root.classList.toggle('sehx2-open');
        burger.setAttribute('aria-expanded', open?'true':'false');
      });
    }

    var links=root.querySelectorAll('[data-sxid]');
    for(var i=0;i<links.length;i++){
      (function(a){ a.addEventListener('click',function(e){ go(a.getAttribute('data-sxid'),e); closeMenu(); }); })(links[i]);
    }
    var books=root.querySelectorAll('[data-sx-book]');
    for(var j=0;j<books.length;j++){
      books[j].addEventListener('click',function(e){ go('spvsl-root',e); });
    }
  })();
  </script>
